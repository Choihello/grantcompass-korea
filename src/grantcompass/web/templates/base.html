<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GrantCompass 기관 검토대장{% endblock %}</title>
  <style>
    :root { --paper:#f4f1e8; --sheet:#fffdf7; --ink:#12263a; --navy:#123a5a; --line:#bcc5c9; --muted:#64717b; --red:#c4432d; --green:#386a55; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"Batang","Noto Serif CJK KR",serif; line-height:1.55; }
    a { color:inherit; }
    .masthead { border-bottom:1px solid var(--navy); background:var(--sheet); }
    .masthead::before { display:block; height:7px; background:var(--navy); content:""; }
    .mast-inner { display:grid; grid-template-columns:1fr auto; align-items:end; width:min(1180px,calc(100% - 32px)); margin:auto; padding:20px 0 14px; }
    .brand { text-decoration:none; }
    .brand small { display:block; color:var(--red); font:700 11px/1 sans-serif; letter-spacing:.16em; }
    .brand strong { display:block; margin-top:5px; font-size:23px; letter-spacing:-.04em; }
    nav { display:flex; gap:8px; font-family:"Malgun Gothic",sans-serif; font-size:13px; }
    nav a { border-bottom:2px solid transparent; padding:8px 10px; text-decoration:none; }
    nav a:hover, nav a:focus-visible { border-color:var(--red); }
    main { width:min(1180px,calc(100% - 32px)); margin:28px auto 64px; }
    .page-head { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:24px; align-items:end; border-bottom:3px double var(--navy); padding-bottom:15px; }
    .kicker { color:var(--red); font:700 11px/1.2 "Malgun Gothic",sans-serif; letter-spacing:.15em; text-transform:uppercase; }
    h1 { margin:5px 0 0; font-size:clamp(28px,4vw,48px); line-height:1.13; letter-spacing:-.055em; }
    h2 { margin:30px 0 10px; border-bottom:2px solid var(--navy); padding-bottom:7px; font-size:19px; }
    .button, button { display:inline-block; border:1px solid var(--navy); background:var(--navy); color:white; padding:10px 14px; font:700 13px "Malgun Gothic",sans-serif; text-decoration:none; cursor:pointer; }
    .button.secondary { background:transparent; color:var(--navy); }
    .ledger { width:100%; border-collapse:collapse; background:var(--sheet); }
    .ledger th { background:var(--navy); color:white; font:700 12px "Malgun Gothic",sans-serif; letter-spacing:.04em; text-align:left; }
    .ledger th, .ledger td { border:1px solid var(--line); padding:11px 12px; vertical-align:top; }
    .ledger tbody tr:hover { background:#f7f3e8; }
    .badge { display:inline-block; margin:1px 3px 1px 0; border:1px solid currentColor; padding:2px 6px; color:var(--red); font:700 10px "Malgun Gothic",sans-serif; }
    .badge.fresh { color:var(--green); }
    .muted { color:var(--muted); }
    .mono { font-family:Consolas,"Malgun Gothic",monospace; font-size:12px; overflow-wrap:anywhere; }
    .sheet { border:1px solid var(--line); background:var(--sheet); padding:22px; box-shadow:5px 5px 0 #d9d5ca; }
    .facts { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); margin-top:18px; border:1px solid var(--line); background:var(--sheet); }
    .fact { min-height:76px; border-right:1px solid var(--line); padding:12px; }
    .fact:last-child { border-right:0; }
    .fact small, label { display:block; color:var(--muted); font:700 11px "Malgun Gothic",sans-serif; letter-spacing:.04em; }
    .fact strong { display:block; margin-top:5px; }
    form.stack { display:grid; gap:14px; }
    input, select, textarea { width:100%; border:1px solid #8b969d; border-radius:0; background:#fffefa; color:var(--ink); padding:10px 11px; font:14px "Malgun Gothic",sans-serif; }
    input:focus, select:focus, textarea:focus { outline:3px solid #d7e2e8; border-color:var(--navy); }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .action-strip { display:grid; grid-template-columns:1fr 1fr auto; gap:10px; align-items:end; margin:12px 0; border-left:4px solid var(--red); background:#ede9de; padding:12px; }
    .audit { border-left:3px solid var(--red); margin:10px 0; background:var(--sheet); padding:10px 14px; }
    .empty { border:1px dashed #929da3; padding:15px; color:var(--muted); }
    @media (max-width:760px) { .mast-inner,.page-head { grid-template-columns:1fr; } nav { margin-top:10px; } .facts,.form-grid,.action-strip { grid-template-columns:1fr; } .fact { border-right:0; border-bottom:1px solid var(--line); } .ledger { display:block; overflow-x:auto; } }
  </style>
</head>
<body>
  <header class="masthead"><div class="mast-inner">
    <a class="brand" href="/programs"><small>GRANTCOMPASS KOREA 0.1</small><strong>기관 검토대장</strong></a>
    <nav aria-label="주요 화면"><a href="/programs">공고대장</a><a href="/companies">관리기업</a><a href="/programs/manual">자체사업 등록</a></nav>
  </div></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
