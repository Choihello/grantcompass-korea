{% extends "base.html" %}
{% block title %}자체사업 등록 · GrantCompass{% endblock %}
{% block content %}
<header class="page-head"><div><div class="kicker">Manual notice desk</div><h1>기관 자체사업 등록</h1><p class="muted">기관 공고도 동일한 출처·문서·근거 파이프라인에 기록합니다.</p></div></header>
<section class="sheet" style="max-width:820px;margin-top:24px">
<form class="stack" action="/programs/manual" method="post" enctype="multipart/form-data">
  <div><label for="title">사업명</label><input id="title" name="title" required></div>
  <div class="form-grid"><div><label for="organization">주관기관</label><input id="organization" name="organization" required></div><div><label for="application_end">접수 마감</label><input id="application_end" name="application_end" type="date" required></div></div>
  <div><label for="source_url">공식 원문 URL</label><input id="source_url" name="source_url" type="url" required placeholder="https://"></div>
  <div><label for="document">공고문 PDF 또는 HWPX</label><input id="document" name="document" type="file" accept=".pdf,.hwpx"></div>
  <div class="form-grid"><div><label for="actor">등록자</label><input id="actor" name="actor" required></div><div><label for="reason">등록 사유</label><input id="reason" name="reason" required></div></div>
  <div><button type="submit">대장에 등록</button></div>
</form></section>
{% endblock %}
